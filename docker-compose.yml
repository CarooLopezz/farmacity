services:
  mysql:
    image: mysql:8.0
    container_name: farmacia_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: farmacia_db
      MYSQL_USER: farmacia
      MYSQL_PASSWORD: farmacia123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: